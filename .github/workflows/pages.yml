name: GitHub Pages

on:
  push:
    branches: [claude/getting-started-jcwiow]
  # Commits des Daten-Updates (GITHUB_TOKEN) lösen kein "push" aus,
  # deshalb nach jedem Lauf von "Daten aktualisieren" neu veröffentlichen.
  workflow_run:
    workflows: [Daten aktualisieren]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/getting-started-jcwiow

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html css js data assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

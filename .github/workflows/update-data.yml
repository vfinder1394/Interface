name: Daten aktualisieren

on:
  schedule:
    # alle 3 Stunden (Minute 17, um die volle Stunde zu meiden)
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Snapshot aus der UEFA-API aktualisieren
        run: node scripts/update-snapshot.mjs

      - name: Änderungen committen
        run: |
          if git diff --quiet -- data/snapshot.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "Daten: Nations-League-Snapshot aktualisiert"
          git pull --rebase --autostash
          git push
